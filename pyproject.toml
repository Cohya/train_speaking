[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "train-speaking"
version = "0.1.0"
description = "Local real-time AI interview simulator and speaking coach."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nicegui>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "openai>=3.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
speech = [
    "faster-whisper>=1.0",
    "silero-vad>=5.1",
    "kokoro>=0.9",
    "soundfile>=0.12",
    "torch>=2.3",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
train-speaking = "train_speaking.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
train_speaking = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "gpu: requires a CUDA GPU and the speech extras",
    "real_providers: loads real speech or LLM models",
]
addopts = "-m 'not gpu and not real_providers' --basetemp=.cache/pytest-tmp -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# IPA phoneme symbols are intentional.
"src/train_speaking/voice/visemes.py" = ["RUF001"]
"tests/unit/test_visemes.py" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
packages = ["train_speaking"]
mypy_path = "src"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "faster_whisper.*",
    "ctranslate2.*",
    "silero_vad.*",
    "kokoro.*",
    "soundfile.*",
    "torch.*",
    "pypdf.*",
]
ignore_missing_imports = true
